# On every push / pull request:
#   check - scan for committed secrets, unit tests, build the client, smoke-test the server in production mode
#   uat   - end-to-end acceptance scenarios (tests/e2e) in headless Chromium
#   deploy - pushes to main only, after check and uat pass: ships the commit to the AWS server (README, Option 2b)
name: CI
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  # Never cancel main: a new push must not interrupt a deploy that is restarting the server
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Scan for secrets
        run: node tools/check-secrets.mjs
      - name: Install dependencies
        run: npm ci
      - name: Lint (undefined names)
        run: npm run lint
      - name: Unit tests
        run: npm test
      - name: Build client
        run: node tools/build.mjs
      - name: Smoke-test server
        run: |
          TOKEN_SECRET=$(node -e "console.log(require('crypto').randomBytes(32).toString('hex'))") NODE_ENV=production DATA_DIR=/tmp/qmq PORT=3999 node server/src/index.js &
          for i in $(seq 1 20); do curl -fsS http://localhost:3999/api/health && exit 0; sleep 0.5; done
          echo "server did not start"; exit 1

  uat:
    needs: check
    # Not ubuntu-latest: it moved to 26.04, which Playwright 1.56 cannot install Chromium on. Move this with Playwright.
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm ci
      - name: Install Chromium
        run: npx playwright-core install --with-deps chromium
      - name: Run UAT scenarios
        run: npm run uat
      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: uat-screenshots
          path: tests/e2e/out/
          if-no-files-found: ignore
          retention-days: 7

  deploy:
    needs: [check, uat]
    # Skipped until the repository variables exist (terraform output github_variables)
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.AWS_DEPLOY_ROLE_ARN != ''
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write # lets the job exchange a GitHub token for short-lived AWS credentials
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
      - name: Deploy to the server
        env:
          DEPLOY_BUCKET: ${{ vars.DEPLOY_BUCKET }}
          DEPLOY_DOCUMENT: ${{ vars.DEPLOY_DOCUMENT }}
          DEPLOY_INSTANCE_ID: ${{ vars.DEPLOY_INSTANCE_ID }}
        run: infra/ci-deploy.sh
